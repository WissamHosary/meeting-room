# Render Blueprint: one free web service + one free Key-Value store for the office data.
services:
  - type: web
    name: meeting-room
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/team
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your private owner key. Render generates it; read it under Environment in the dashboard.
      - key: OWNER_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meeting-room-store
          property: connectionString

  - type: keyvalue
    name: meeting-room-store
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private: only reachable from your Render services
